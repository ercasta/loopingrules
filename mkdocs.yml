site_name: LoopingRules Developer Guide
site_url: https://ercasta.github.io/loopingrules/
site_description: An entity-component world, a loop of rules over it, and one thread to run a session on.
docs_dir: docs
repo_url: https://github.com/ercasta/loopingrules
repo_name: ercasta/loopingrules
theme:
  name: material
  features:
    - navigation.instant
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Handoff (attribute-substrate port): handoff.md
  - Getting started: getting-started.md
  - Core concepts: concepts.md
  - Architecture: architecture.md
  - Writing rules: writing-rules.md
  - The engine and channels: engine.md
  - Persistence and sharing: persistence.md
  - Rule analysis: analysis.md
  - Examples: examples.md
  - Patterns: patterns.md
  - Modeling: modeling.md
  - Comparison with SOAR: comparison-soar.md
  - Testing and debugging: testing-debugging.md
  - Contributing: contributing.md
  - Study guide: study-guide.md
  - Study plan (8-16 h): study-plan.md
  - Plan:
      - Roadmap: plan.md
      - Memory and the change log: plan-memory.md
      - Dataset and scoring: plan-dataset.md
      - Calibration API and knobs: plan-calibration.md
      - Online adaptation: plan-adaptation.md
      - The forge (corpus to catalog): plan-forge.md
      - Islands and bridges: plan-islands.md
      - Reflection and the control channel: plan-reflection.md
      - The scheduler (recognize-act): plan-scheduler.md
      - The attribute substrate: plan-attributes.md
      - The stigmergic control network: plan-control-network.md
      - Knowledge mazes: plan-maze.md
