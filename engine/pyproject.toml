[project]
name = "loopingrules"
version = "0.0.1"
description = "A semantic spreadsheet: RDF state, SPARQL operations, SHACL guards, scoring controllers."
requires-python = ">=3.11"
dependencies = ["rdflib>=7.0", "pyshacl>=0.26", "rich>=13"]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
# fast: match operation patterns natively (D30). 0.5.0 loads under Windows Smart App Control;
# some later builds are blocked there, and the engine then falls back to rdflib.
fast = ["pyoxigraph>=0.5.0"]
dev = ["pytest>=8", "httpx>=0.27", "loopingrules[server]"]

[project.scripts]
lr = "loopingrules.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loopingrules", "loopingrules.tools"]
