<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rubik viewer · LoopingRules</title>
    <style>
      :root {
        --ink: #1d1f24; --muted: #6b7079; --line: #e3e5ea; --panel: rgba(255, 255, 255, 0.86);
        --accent: #3a5bd9; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: radial-gradient(ellipse at 50% 40%, #fbfbfd, #e9ebf0); }
      #stage { position: fixed; inset: 0; }
      .panel {
        position: fixed; background: var(--panel); backdrop-filter: blur(8px); border: 1px solid var(--line);
        border-radius: 12px; padding: 14px 16px; box-shadow: 0 4px 24px rgba(20, 24, 40, 0.06);
      }
      #controls { top: 16px; left: 16px; width: 260px; }
      h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: 0.01em; }
      .sub { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
      .buttons { display: flex; gap: 6px; margin-bottom: 12px; }
      button {
        flex: 1; font: inherit; font-size: 13px; padding: 6px 0; border-radius: 8px; cursor: pointer;
        border: 1px solid var(--line); background: #fff; color: var(--ink);
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:hover { filter: brightness(0.97); }
      label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
      input[type="range"] { flex: 1; accent-color: var(--accent); }
      #status { font-size: 12px; color: var(--muted); margin-top: 10px; }
      #side { top: 16px; right: 16px; width: 300px; max-height: calc(100% - 120px); overflow: hidden; }
      #side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
      #log { list-style: none; margin: 0; padding: 0; font-size: 13px; }
      #log li { padding: 5px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
      #log li.me { color: var(--muted); }
      #log li.error { color: #b3261e; }
      #bottom { left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 14px; }
      #bottom .n { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; }
      #moves { display: flex; gap: 4px; overflow: hidden; flex-wrap: nowrap; justify-content: flex-end; flex: 1; }
      #moves span {
        font: 600 13px ui-monospace, "Cascadia Code", Consolas, monospace; padding: 3px 7px; border-radius: 6px;
        background: #eef1fb; color: var(--accent); flex: none;
      }
      #moves span:last-child { background: var(--accent); color: #fff; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="controls" class="panel">
      <h1>Rubik viewer</h1>
      <div class="sub">driven by LoopingRules over lr:in / lr:out</div>
      <div class="buttons">
        <button id="scramble" class="primary">Scramble</button>
        <button id="reset">Reset</button>
        <button id="sync" title="ask the model for the cube's colours">Sync</button>
      </div>
      <label>turn <input id="speed" type="range" min="60" max="1200" step="20" value="320" /> slow</label>
      <div id="status">connecting…</div>
    </div>
    <div id="side" class="panel">
      <h2>Messages</h2>
      <ul id="log"></ul>
    </div>
    <div id="bottom" class="panel">
      <span class="n">turns <b id="count">–</b></span>
      <div id="moves"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
